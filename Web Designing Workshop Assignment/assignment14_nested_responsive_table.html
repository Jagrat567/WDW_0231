<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested and Responsive Table</title>
  <style>
    table, th, td { border: 1px solid #333; border-collapse: collapse; padding: 8px; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="table-wrap">
    <table>
      <tr>
        <th>Day</th><th>Lab Batches</th><th>Faculty</th><th>Room</th><th>Time</th>
      </tr>
      
    </table>
  </div>
</body>
</html>
