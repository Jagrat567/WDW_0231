<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select, Textarea and Buttons</title>
</head>
<body>
  <form>
    <p>
      <label for="course">Course:</label>
      <select id="course" name="course">
        <option value="ece">ECE</option>
        <option value="cse">CSE</option>
        <option value="me">ME</option>
      </select>
    </p>

  </form>
</body>
</html>
