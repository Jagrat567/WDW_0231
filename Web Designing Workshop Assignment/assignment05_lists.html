<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lists</title>
</head>
<body>
  <h3>Unordered</h3>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <h3>Ordered</h3>
  <ol type="A">
    <li>Install VS Code</li>
    <li>Create file</li>
    <li>Open in browser</li>
  </ol>

</body>
</html>
